{% extends 'base.html' %}

{% block title %}Подтверждение email - Mail Pilot{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="text-center">
          <div class="mb-4" style="font-size: 80px;">⏳</div>
          <h1 class="h3 mb-3">Проверяем ваш email...</h1>
          <p class="text-muted">Пожалуйста, подождите</p>

          <div class="spinner-border text-primary mt-3" role="status">
            <span class="visually-hidden">Загрузка...</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
