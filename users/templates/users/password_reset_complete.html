{% extends 'base.html' %}

{% block title %}Пароль изменен - Mail Pilot{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="alert alert-success shadow-sm">
        <h4 class="alert-heading">✅ Пароль успешно изменен!</h4>
        <hr>
        <p class="mb-0">Ваш пароль был успешно изменен.</p>
        <p class="mt-2 mb-0">Теперь вы можете войти в систему с новым паролем.</p>
      </div>
      <div class="text-center mt-3">
        <a href="{% url 'users:login' %}" class="btn btn-primary btn-lg">Войти</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
