{% extends "base.html" %}

{% block title %}Удалить клиента - Mail Pilot{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
          <h3 class="mb-0">⚠️ Удалить клиента?</h3>
        </div>
        <div class="card-body">
          <p class="mb-4">
            Вы уверены, что хотите удалить клиента <strong>"{{ client.full_name }}"</strong>?
          </p>
          <p class="text-muted small">
            Это действие невозможно отменить.
          </p>

          <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-danger">Да, удалить</button>
              <a href="{{ client.get_absolute_url }}" class="btn btn-outline-secondary">
                Отмена
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
