{% extends "base.html" %}

  {% block content %}
  <h1>Удалить клиента?</h1>

  <p>Вы уверены, что хотите удалить клиента "{{ client.full_name }}"?</p>

  <form method="post">
      {% csrf_token %}
      <button type="submit">Да, удалить</button>
      <a href="{% url 'campaigns:client_detail' client.pk %}">Отмена</a>
  </form>
  {% endblock %}
